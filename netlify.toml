#  Netlify Configuration for Vite + Supabase
# ─────────────────────────────────────────────
[build]
  command = "npm run build"          # Standard Vite build command
  publish = "dist"                   # Output directory after build

# ─────────────────────────────────────────────
#  Environment Variables (safe and hidden)
# ─────────────────────────────────────────────
[build.environment]
  VITE_SUPABASE_URL = "YOUR_SUPABASE_URL"
  VITE_SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY"

# ─────────────────────────────────────────────
#  Security and post-processing
# ─────────────────────────────────────────────
[build.processing]
  secrets_scan_enabled = true        # Keep secrets scanning ON

# ─────────────────────────────────────────────
#  Redirects for Single Page Apps (Vite, React, Vue)
# ─────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ─────────────────────────────────────────────
#  Asset optimization (optional)
# ─────────────────────────────────────────────
[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.images]
  compress = true